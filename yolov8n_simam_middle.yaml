# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 object detection model with SimAM attention (middle layer)

# Parameters
nc: 4
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8.0n backbone with SimAM (after layer 5)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]      # 4
  
  # ✅ SimAM 放在这里（第5层）
  - [-1, 1, SimAM, [256]]          # 5
  
  - [-1, 1, Conv, [512, 3, 2]]     # 6-P4/16
  - [-1, 6, C2f, [512, True]]      # 7
  - [-1, 1, Conv, [1024, 3, 2]]    # 8-P5/32
  - [-1, 3, C2f, [1024, True]]     # 9
  - [-1, 1, SPPF, [1024, 5]]       # 10

# YOLOv8.0n head（索引已调整）
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]           # 11
  - [[-1, 7], 1, Concat, [1]]                            # 12（引用 backbone 第7层）
  - [-1, 3, C2f, [512]]                                  # 13

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]           # 14
  - [[-1, 4], 1, Concat, [1]]                            # 15（引用 backbone 第4层）
  - [-1, 3, C2f, [256]]                                  # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                           # 17
  - [[-1, 13], 1, Concat, [1]]                           # 18
  - [-1, 3, C2f, [512]]                                  # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                           # 20
  - [[-1, 10], 1, Concat, [1]]                           # 21（引用 backbone 第10层）
  - [-1, 3, C2f, [1024]]                                 # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]                      # 23 Detect